<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#103F34" />
    <meta name="description" content="Illustrative ERP demo for hardware distribution and dynamic pricing. Fictional data only - not an official MK Hardware system." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    <title>MK Hardware ERP · Demo</title>
    <script>
      // Apply saved theme before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem('mk-erp-prefs') || '{}');
        var t = (s.state && s.state.theme) || 'light';
        if (t === 'system' && (s.version || 0) < 2) t = 'light';
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This ERP demo requires JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
